name: Deploy to webserver in aws.

on:
  push:
    branches:
      - dev

jobs:
  deploy_to_webserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Deploy to webserver
        run: |
            echo "Deploying to webserver..."
            mkdir -p ~/.ssh
            cat << EOF > ~/.ssh/id_rsa
            ${{ vars.SSH_KEY }} 
            EOF
            chmod 600 ~/.ssh/id_rsa
            
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r ./* root@${{ secrets.SERVER_IP }}:/var/www/html/
















